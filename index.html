<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqaluit Landmark Explorer ᐃᖃᓗᐃᑦ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MSAL.js for Microsoft Entra ID Sign-in -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <!-- Azure Storage Blob SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/storage-blob@12.17.0/dist/index.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b1320;
            color: #e2e8f0;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #111827;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .custom-marker i {
            transform: rotate(45deg);
            color: white;
            font-size: 14px;
        }
        .custom-marker:hover {
            transform: rotate(-45deg) scale(1.15);
            z-index: 1000 !important;
        }

        .edit-badge {
            display: none;
        }
        .logged-in .edit-badge {
            display: flex;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none" id="appBody">
    <!-- TOP NAVBAR -->
    <header class="bg-[#0c1626] border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 z-30 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-cyan-500/10 p-2.5 rounded-full border border-cyan-500/30 text-cyan-400">
                <i class="fa-solid fa-compass text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-lg font-bold tracking-wide text-white">Iqaluit Landmark Explorer</h1>
                    <span class="text-xs bg-cyan-900/60 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700/50 font-medium">ᐃᖃᓗᐃᑦ</span>
                </div>
                <p class="text-xs text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-cyan-400 text-[10px]"></i> Nunavut, Canada
                    <span class="text-slate-600">•</span>
                    <span>Powered by OpenStreetMap & CARTO</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="mapStyleBtn" onclick="toggleMapStyle()" class="px-3.5 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 flex items-center gap-2 transition">
                <i class="fa-solid fa-layer-group text-slate-400"></i>
                <span>Map Style</span>
            </button>

            <button onclick="startTour()" class="px-3.5 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 flex items-center gap-2 transition">
                <i class="fa-solid fa-route text-cyan-400"></i>
                <span>Guided Tours</span>
            </button>

            <!-- Microsoft Sign In Button -->
            <button id="msAuthBtn" onclick="handleAuth()" class="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium rounded-lg flex items-center gap-2 shadow-sm transition">
                <i class="fa-brands fa-microsoft"></i>
                <span id="msAuthText">Sign in with Microsoft</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- LEFT SIDEBAR -->
        <aside class="w-80 md:w-96 bg-[#0c1626] border-r border-slate-800 flex flex-col z-20 shadow-xl">
            <!-- Search & Filters -->
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="filterLandmarks()" placeholder="Search landmarks, culture, trails..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-900/90 text-sm text-slate-200 rounded-lg border border-slate-700 focus:outline-none focus:border-cyan-500 placeholder-slate-500 transition">
                </div>

                <!-- Category Filters -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                    <button onclick="setCategory('all')" class="cat-filter active px-3 py-1 rounded-full bg-cyan-600 text-white font-medium">All</button>
                    <button onclick="setCategory('Culture')" class="cat-filter px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">Culture</button>
                    <button onclick="setCategory('Nature')" class="cat-filter px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">Nature</button>
                    <button onclick="setCategory('Government')" class="cat-filter px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">Government</button>
                    <button onclick="setCategory('Civic')" class="cat-filter px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">Civic</button>
                </div>
            </div>

            <!-- Landmark List -->
            <div id="landmarkList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>

            <!-- Sidebar Footer -->
            <div class="p-3 bg-[#08101c] border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <span id="landmarkCount">Showing 0 landmarks</span>
                <button onclick="resetMapView()" class="text-cyan-400 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-arrows-to-dot"></i> Reset View
                </button>
            </div>
        </aside>

        <!-- MAP CONTAINER -->
        <main class="flex-1 relative">
            <div id="map"></div>

            <!-- TOP RIGHT CITY INFO CARD (With Close Button) -->
            <div id="cityInfoCard" class="absolute top-4 right-4 z-[1000] w-80 bg-[#0e1a2d]/95 backdrop-blur border border-slate-700/80 rounded-xl p-4 shadow-2xl transition-all duration-300">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-snowflake text-cyan-400 text-base"></i>
                        <h2 class="text-sm font-bold text-cyan-300">Iqaluit, NU</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-mono text-slate-400">63.7467° N, 68.5170° W</span>
                        <button onclick="toggleCityInfoCard()" class="text-slate-400 hover:text-white p-1 hover:bg-slate-800 rounded transition" title="Close">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    </div>
                </div>
                <p class="text-xs text-slate-300 mt-2 leading-relaxed">
                    Capital city of Nunavut located on Frobisher Bay on Baffin Island.
                </p>

                <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-end gap-2">
                    <button onclick="recenterCity()" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-cyan-400 rounded-lg text-xs" title="Center Map">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                    <button onclick="toggleFullscreen()" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-lg text-xs" title="Toggle Fullscreen">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>

            <!-- Re-open City Info Button -->
            <button id="openCityInfoBtn" onclick="toggleCityInfoCard()" class="hidden absolute top-4 right-4 z-[1000] p-2.5 bg-[#0e1a2d] border border-slate-700 text-cyan-400 rounded-xl shadow-xl hover:bg-slate-800 transition">
                <i class="fa-solid fa-circle-info text-base"></i>
            </button>
        </main>
    </div>

    <!-- Hidden Upload Input for Azure Blob Storage -->
    <input type="file" id="azureFileInput" accept="image/*" class="hidden" onchange="uploadToAzureStorage(event)" />

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 1. CARTO Basemap & Azure Storage Configuration ---
        const CARTO_KEY = "cb1_3mop_2_3be4de199ed5624ded1cd5cc";

        // Azure Blob Storage Details
        // Configure SAS Token or Azure Storage Account URL for direct uploads
        const AZURE_STORAGE_ACCOUNT = "iqaluitlandmarksstorage"; 
        const AZURE_CONTAINER_NAME = "landmark-photos";
        const AZURE_SAS_TOKEN = "sv=2022-11-02&ss=b&srt=sco&sp=rwdlacu&se=2030-01-01T00:00:00Z&st=2026-01-01T00:00:00Z&spr=https&sig=DEMO_SAS_TOKEN";

        const tileLayers = {
            dark: L.tileLayer(`https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?api_key=${CARTO_KEY}`, {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }),
            voyager: L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?api_key=${CARTO_KEY}`, {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            })
        };

        const IQALUIT_COORDS = [63.7467, -68.5170];
        const map = L.map('map', { center: IQALUIT_COORDS, zoom: 13, zoomControl: false });

        let currentStyle = 'dark';
        tileLayers[currentStyle].addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // --- 2. Landmark Data ---
        const landmarks = [
            {
                id: 'assembly',
                name: "Legislative Assembly of Nunavut",
                syllabics: "ᓄᓇᕘᒥ LcLcDᕐᕕᐊ",
                category: "Government",
                coords: [63.7485, -68.5186],
                color: "#3b82f6",
                icon: "fa-building-columns",
                desc: "The government center of Nunavut, showcasing authentic Inuit art and a famous narwhal tusk mace.",
                tags: ["Narwhal Tusk Mace", "Inuit Tapestry Art", "Public Gallery Tours"]
            },
            {
                id: 'cathedral',
                name: "St. Jude's Anglican Cathedral",
                syllabics: "ᑐᒃᓯᐊᕐᕕᒃ",
                category: "Culture",
                coords: [63.7455, -68.5140],
                color: "#a855f7",
                icon: "fa-church",
                desc: "Iconic Igloo-shaped cathedral serving as the seat of the Anglican Diocese of the Arctic.",
                tags: ["Igloo Architecture", "Diocese Seat", "Narwhal Cross"]
            },
            {
                id: 'visitor',
                name: "Unikkaarvik Visitor Centre",
                syllabics: "ᐅᓂᒃᑳᕐᕕᒃ",
                category: "Culture",
                coords: [63.7432, -68.5125],
                color: "#f59e0b",
                icon: "fa-circle-info",
                desc: "Interactive displays on Arctic wildlife, Inuit culture, history, and travel guidance.",
                tags: ["Life-size Polar Bear", "Cultural Exhibits", "Visitor Info"]
            },
            {
                id: 'park',
                name: "Sylvia Grinnell Territorial Park",
                syllabics: "ᓯᓪᕕᐊ ᒍᕇᓂᓪ 公園",
                category: "Nature",
                coords: [63.7510, -68.5490],
                color: "#10b981",
                icon: "fa-tree",
                desc: "Scenic tundra landscapes, river fishing spots, tundra trails, and ancient archaeological sites.",
                tags: ["Tundra Hiking", "River Rapids", "Wildlife Spotting"]
            },
            {
                id: 'apex',
                name: "Apex Beach & Historic Hudson's Bay Post",
                syllabics: "ᓂᐊᖁᙳᖢᒃ",
                category: "Civic",
                coords: [63.7280, -68.4550],
                color: "#ec4899",
                icon: "fa-anchor",
                desc: "Historic community area featuring traditional wooden Hudson's Bay Company buildings.",
                tags: ["HBC Buildings", "Beach Scenery", "Historic Settlement"]
            }
        ];

        let activeMarkers = {};
        let currentCategory = 'all';
        let targetLandmarkForUpload = null;

        function renderLandmarks(items) {
            const listContainer = document.getElementById('landmarkList');
            listContainer.innerHTML = '';

            Object.values(activeMarkers).forEach(m => map.removeLayer(m));
            activeMarkers = {};

            items.forEach(item => {
                const storedAzureUrl = localStorage.getItem(`azure_img_${item.id}`);

                const card = document.createElement('div');
                card.className = "p-3.5 bg-slate-900/80 hover:bg-slate-800/90 rounded-xl border border-slate-800 transition cursor-pointer group relative";
                card.onclick = () => focusLandmark(item);

                const imageBlock = storedAzureUrl
                    ? `<img src="${storedAzureUrl}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0 mt-0.5 border border-cyan-500/50" />`
                    : `<div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5" style="background-color: ${item.color}20; color: ${item.color};">
                        <i class="fa-solid ${item.icon} text-base"></i>
                       </div>`;

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="relative">
                            ${imageBlock}
                            <button onclick="triggerPhotoUpload(event, '${item.id}')" class="edit-badge absolute -bottom-1 -right-1 bg-sky-600 text-white rounded-full w-4 h-4 text-[9px] items-center justify-center shadow hover:bg-sky-500" title="Upload to Microsoft Storage">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-bold text-slate-100 group-hover:text-cyan-300 transition truncate">${item.name}</h3>
                            <p class="text-[11px] text-cyan-400 font-medium mb-1">${item.syllabics}</p>
                            <p class="text-xs text-slate-400 line-clamp-2 leading-snug">${item.desc}</p>
                            <div class="flex flex-wrap gap-1.5 mt-2.5">
                                ${item.tags.map(tag => `<span class="px-2 py-0.5 text-[10px] bg-slate-800 text-slate-300 rounded border border-slate-700">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);

                const iconHtml = `
                    <div class="custom-marker" style="background-color: ${item.color}; border-color: #ffffff;">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                `;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                    popupAnchor: [0, -28]
                });

                const popupMedia = storedAzureUrl 
                    ? `<img src="${storedAzureUrl}" class="w-full h-24 object-cover rounded mb-2"/>` 
                    : '';

                const marker = L.marker(item.coords, { icon: customIcon }).addTo(map);
                marker.bindPopup(`
                    <div class="p-2 text-slate-900 max-w-[200px]">
                        ${popupMedia}
                        <h4 class="font-bold text-sm">${item.name}</h4>
                        <p class="text-xs text-cyan-700 font-medium">${item.syllabics}</p>
                        <p class="text-xs text-slate-600 mt-1">${item.desc}</p>
                    </div>
                `);

                activeMarkers[item.id] = marker;
            });

            document.getElementById('landmarkCount').innerText = `Showing ${items.length} landmark${items.length !== 1 ? 's' : ''}`;
        }

        // --- 3. Microsoft Azure Storage Upload Logic ---
        function triggerPhotoUpload(e, landmarkId) {
            e.stopPropagation();
            targetLandmarkForUpload = landmarkId;
            document.getElementById('azureFileInput').click();
        }

        async function uploadToAzureStorage(event) {
            const file = event.target.files[0];
            if (!file || !targetLandmarkForUpload) return;

            try {
                // Construct blob URL targeting your Azure Blob Storage container
                const blobName = `${targetLandmarkForUpload}-${Date.now()}-${file.name}`;
                const blobUrl = `https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_CONTAINER_NAME}/${blobName}`;
                const uploadUrl = `${blobUrl}?${AZURE_SAS_TOKEN}`;

                // Upload image file directly to Microsoft Azure Storage Account via PUT request
                const response = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: {
                        'x-ms-blob-type': 'BlockBlob',
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (response.ok) {
                    localStorage.setItem(`azure_img_${targetLandmarkForUpload}`, blobUrl);
                    renderLandmarks(landmarks);
                    alert("Image successfully saved to Microsoft Azure Storage Account!");
                } else {
                    // Fallback to local DataURL preview if SAS permissions are restricted
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        localStorage.setItem(`azure_img_${targetLandmarkForUpload}`, e.target.result);
                        renderLandmarks(landmarks);
                    };
                    reader.readAsDataURL(file);
                }
            } catch (err) {
                console.error("Azure Upload Error:", err);
            }
        }

        function focusLandmark(item) {
            map.flyTo(item.coords, 15, { duration: 1.2 });
            if (activeMarkers[item.id]) activeMarkers[item.id].openPopup();
        }

        function filterLandmarks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = landmarks.filter(item => {
                const matchesCat = (currentCategory === 'all' || item.category === currentCategory);
                const matchesQuery = item.name.toLowerCase().includes(query) ||
                                     item.syllabics.toLowerCase().includes(query) ||
                                     item.desc.toLowerCase().includes(query) ||
                                     item.tags.some(t => t.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });
            renderLandmarks(filtered);
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-filter').forEach(btn => {
                if (btn.innerText.toLowerCase() === cat.toLowerCase() || (cat === 'all' && btn.innerText === 'All')) {
                    btn.className = "cat-filter active px-3 py-1 rounded-full bg-cyan-600 text-white font-medium";
                } else {
                    btn.className = "cat-filter px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium";
                }
            });
            filterLandmarks();
        }

        function resetMapView() { map.flyTo(IQALUIT_COORDS, 13); }
        function recenterCity() { map.flyTo(IQALUIT_COORDS, 13); }

        function toggleCityInfoCard() {
            document.getElementById('cityInfoCard').classList.toggle('hidden');
            document.getElementById('openCityInfoBtn').classList.toggle('hidden');
        }

        function toggleMapStyle() {
            map.removeLayer(tileLayers[currentStyle]);
            currentStyle = (currentStyle === 'dark') ? 'voyager' : 'dark';
            tileLayers[currentStyle].addTo(map);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        // --- 4. Microsoft Entra ID Authentication ---
        const msalConfig = {
            auth: {
                clientId: "dc2e8a2e-cbf9-4e06-b1a1-54e79552be42",
                authority: "https://login.microsoftonline.com/common",
                redirectUri: window.location.origin + window.location.pathname
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let currentUser = null;

        async function handleAuth() {
            if (currentUser) {
                await msalInstance.logoutPopup();
                currentUser = null;
                document.getElementById('msAuthText').innerText = "Sign in with Microsoft";
                document.getElementById('msAuthBtn').classList.replace('bg-emerald-600', 'bg-sky-600');
                document.getElementById('appBody').classList.remove('logged-in');
            } else {
                try {
                    const loginResponse = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                    currentUser = loginResponse.account;
                    document.getElementById('msAuthText').innerText = `Hi, ${currentUser.name ? currentUser.name.split(' ')[0] : 'User'}`;
                    document.getElementById('msAuthBtn').classList.replace('bg-sky-600', 'bg-emerald-600');
                    document.getElementById('appBody').classList.add('logged-in');
                } catch (err) {
                    console.error("Microsoft Sign-in Error:", err);
                }
            }
        }

        renderLandmarks(landmarks);
    </script>
</body>
</html>
